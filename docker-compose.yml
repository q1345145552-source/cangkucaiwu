services:
  db:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse_finance
    # 仅绑定到本机回环，不对公网暴露数据库端口
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads:/app/uploads
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@db:5432/warehouse_finance
      SECRET_KEY: ${SECRET_KEY:?请在 .env 设置 SECRET_KEY}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    # 生产环境使用镜像内代码，不挂载宿主源码（仅持久化上传目录）
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      TZ: Asia/Bangkok
      NEXT_PUBLIC_API_URL: /api/v1
    # 生产环境使用镜像内构建产物，不挂载宿主源码
    command: sh -c "npm start"

volumes:
  pgdata:
  uploads:
